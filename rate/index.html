<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Rate Sudoku Carve</title>
  <meta name="description" content="Rate Sudoku Carve on the App Store or Google Play." />
  <meta name="theme-color" content="#43288B" />
  <link rel="icon" href="../assets/app-icon.webp" type="image/webp" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #43288B; color: #fff; font-family: Poppins, Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 20px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; opacity: .9; max-width: 320px; }
    .btn { display: block; width: 100%; max-width: 320px; box-sizing: border-box; margin: 0 0 12px; padding: 14px 20px; border-radius: 16px; background: #fff; color: #43288B; font-weight: 600; font-size: 16px; text-decoration: none; }
    .hidden { display: none; }
  </style>
  <script>
    (function () {
      var IOS = 'https://apps.apple.com/app/id6761488124?action=write-review';
      var ANDROID = 'https://play.google.com/store/apps/details?id=com.Eduplica.SudokuForge';
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      if (isIOS) { location.replace(IOS); }
      else if (isAndroid) { location.replace(ANDROID); }
      else { document.addEventListener('DOMContentLoaded', function () { document.getElementById('choose').classList.remove('hidden'); }); }
    })();
  </script>
</head>
<body>
<main>
  <img src="../assets/app-icon.webp" alt="" width="96" height="96" />
  <h1>Rate Sudoku Carve</h1>
  <div id="choose" class="hidden">
    <p>Open this page on your phone, or pick your store:</p>
    <a class="btn" href="https://apps.apple.com/app/id6761488124?action=write-review">Rate on the App Store</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.Eduplica.SudokuForge">Rate on Google Play</a>
  </div>
  <noscript>
    <p>Pick your store:</p>
    <a class="btn" href="https://apps.apple.com/app/id6761488124?action=write-review">Rate on the App Store</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.Eduplica.SudokuForge">Rate on Google Play</a>
  </noscript>
</main>
</body>
</html>
